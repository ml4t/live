# ML4T Live Documentation
# MkDocs Material configuration with Picasso Blue palette

site_name: ML4T Live
site_description: Live trading runtime for causal ML4T strategies
site_url: https://www.ml4trading.io/docs/live/
repo_url: https://github.com/ml4t/live
repo_name: ml4t/live

# Theme configuration
theme:
  name: material
  custom_dir: docs/overrides

  palette:
    scheme: default
    primary: custom
    accent: custom

  font: false

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - User Guide:
    - Backtest to Live: user-guide/backtest-to-live.md
    - Lifecycle Migration: user-guide/migration.md
    - Risk Controls: user-guide/risk.md
    - Brokers: user-guide/brokers.md
    - Data Feeds: user-guide/feeds.md
    - CLI: user-guide/cli.md
    - Examples: user-guide/examples.md
    - Operator Guide: user-guide/operator-guide.md
  - Candidate Qualification: qualification.md
  - Release Recovery: release-recovery.md
  - Claim Evidence: claim-evidence.md
  - API Reference:
    - api/index.md
  - Book Guide: book-guide/index.md

# Extra configuration
extra:
  ml4t_docs_hub_url: /docs/
  ml4t_libraries_url: /libraries/
  ml4t_chapters_url: /chapters/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefan-jansen
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/mlaboratory

  generator: false

