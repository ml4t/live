name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact qualified commit to recover
        required: true
        type: string
      qualification-run-id:
        description: Failed release run containing qualified artifacts
        required: true
        type: string
      tag:
        description: Existing version tag for the candidate
        required: true
        type: string

permissions: {}

jobs:
  ecosystem-qualification:
    name: Ecosystem Qualification
    permissions:
      contents: read
    if: github.event_name == 'push'
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@457678d8860d0c816b1dc376e7e2691daa93af4d # v0.1.0
    with:
      import-package: ml4t.live

  qualification:
    name: Complete stable qualification
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/stable-qualification.yml

  paper-evidence:
    name: Require exact exercises and reusable provider evidence
    runs-on: ubuntu-latest
    outputs:
      wheel_sha256: ${{ steps.paper.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.paper.outputs.sdist_sha256 }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate-sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - name: Create a clean paper evidence runtime
        id: paper-runtime
        run: |
          uv venv --clear --python 3.12 "${RUNNER_TEMP}/paper-evidence-venv"
          uv pip install \
            --python "${RUNNER_TEMP}/paper-evidence-venv/bin/python" \
            "psutil==7.2.2"
      - name: Match successful retained evidence to this commit
        id: paper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${RUNNER_TEMP}/paper-evidence-venv/bin/python"
          scripts/qualification/check_paper_evidence.py
          --repository "${{ github.repository }}"
          --commit "${{ github.event_name == 'workflow_dispatch' && inputs.candidate-sha || github.sha }}"
          --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish exact candidate to PyPI
    runs-on: ubuntu-latest
    needs: [ecosystem-qualification, qualification, paper-evidence]
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-${{ github.sha }}
          path: qualification-evidence/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-${{ github.sha }}
          path: security-evidence/
      - name: Match tag, commit, artifacts, provider evidence, SBOM, and snapshot
        env:
          PAPER_WHEEL_SHA256: ${{ needs.paper-evidence.outputs.wheel_sha256 }}
          PAPER_SDIST_SHA256: ${{ needs.paper-evidence.outputs.sdist_sha256 }}
        run: >-
          python scripts/qualification/verify_release_identity.py
          --artifacts-dir dist
          --artifact-report qualification-evidence/artifact-qualification.json
          --security-report security-evidence/security-report.json
          --sbom security-evidence/sbom.cdx.json
          --dependency-snapshot security-evidence/dependency-snapshot.json
          --commit "${{ github.sha }}"
          --tag "${{ github.ref_name }}"
          --paper-wheel-sha256 "$PAPER_WHEEL_SHA256"
          --paper-sdist-sha256 "$PAPER_SDIST_SHA256"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-${{ github.sha }}
          path: security-evidence/
      - name: Create release for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          security-evidence/sbom.cdx.json
          security-evidence/dependency-snapshot.json
          --generate-notes
          --repo "${{ github.repository }}"
          --verify-tag

  recovery-publish:
    name: Recover exact candidate publication to PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: paper-evidence
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: dist-${{ inputs.candidate-sha }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: qualification-${{ inputs.candidate-sha }}
          path: qualification-evidence/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: security-${{ inputs.candidate-sha }}
          path: security-evidence/
      - name: Match tag, commit, artifacts, provider evidence, SBOM, and snapshot
        env:
          PAPER_WHEEL_SHA256: ${{ needs.paper-evidence.outputs.wheel_sha256 }}
          PAPER_SDIST_SHA256: ${{ needs.paper-evidence.outputs.sdist_sha256 }}
        run: >-
          python scripts/qualification/verify_release_identity.py
          --artifacts-dir dist
          --artifact-report qualification-evidence/artifact-qualification.json
          --security-report security-evidence/security-report.json
          --sbom security-evidence/sbom.cdx.json
          --dependency-snapshot security-evidence/dependency-snapshot.json
          --commit "${{ inputs.candidate-sha }}"
          --tag "${{ inputs.tag }}"
          --paper-wheel-sha256 "$PAPER_WHEEL_SHA256"
          --paper-sdist-sha256 "$PAPER_SDIST_SHA256"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  recovery-github-release:
    name: Create recovered GitHub release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: recovery-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: dist-${{ inputs.candidate-sha }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: security-${{ inputs.candidate-sha }}
          path: security-evidence/
      - name: Create release for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.tag }}"
          dist/*
          security-evidence/sbom.cdx.json
          security-evidence/dependency-snapshot.json
          --generate-notes
          --repo "${{ github.repository }}"
          --verify-tag
