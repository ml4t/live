name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  qualification:
    name: Complete beta qualification
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/qualification.yml

  paper-evidence:
    name: Require fresh paper qualification
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Match successful retained evidence to this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/qualification/check_paper_evidence.py
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --max-age-days 7

  publish:
    name: Publish exact candidate to PyPI
    runs-on: ubuntu-latest
    needs: [qualification, paper-evidence]
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Create release for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
