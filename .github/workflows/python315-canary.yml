name: Python 3.15 dependency and calendar canary

on:
  schedule:
    - cron: "53 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-python315-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Unsupported Python 3.15 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.15"
          allow-prereleases: false
          check-latest: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - name: Export the complete mandatory runtime without installing unsupported Live
        shell: bash
        run: >-
          python scripts/qualification/python315_canary.py requirements
          --output "${{ runner.temp }}/live-python315/declared.txt"
      - name: Resolve all declared dependencies and record an unsupported source import
        timeout-minutes: 5
        shell: bash
        run: >-
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}"
          --with-requirements "${{ runner.temp }}/live-python315/declared.txt"
          --with pytest==9.1.1 --with pytest-asyncio==1.4.0 --with pytest-timeout==2.4.0
          python scripts/qualification/python315_canary.py source
          --output "${{ runner.temp }}/live-python315/source.json"
          2>&1 | tee "${{ runner.temp }}/live-python315/source.log"
      - name: Exercise unsupported source lifecycle and aggregation workflows
        timeout-minutes: 5
        env:
          PYTHONPATH: src
        shell: bash
        run: >-
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}"
          --with-requirements "${{ runner.temp }}/live-python315/declared.txt"
          --with pytest==9.1.1 --with pytest-asyncio==1.4.0 --with pytest-timeout==2.4.0
          python -m pytest -q --strict-markers --timeout=60
          tests/contracts/test_causal_strategy_parity.py tests/unit/test_strategy_runtime.py
          tests/unit/test_bar_aggregator.py tests/integration/test_beta_state_migration.py
          --junitxml="${{ runner.temp }}/live-python315/source.xml"
          2>&1 | tee "${{ runner.temp }}/live-python315/source-tests.log"
      - name: Probe public HKEX on the newer NumPy review stack independently
        if: always()
        timeout-minutes: 5
        shell: bash
        run: >-
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}"
          --with ml4t-backtest==0.2.0 --with ml4t-specs==0.2.0
          --with 'numpy>=2.5.4,<3' --with pandas==3.0.5
          python -I -W error scripts/qualification/python315_canary.py calendar
          --output "${{ runner.temp }}/live-python315/hkex.json"
          2>&1 | tee "${{ runner.temp }}/live-python315/hkex.log"
      - name: Retain diagnostic evidence even when either probe fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-python315-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/live-python315/
          if-no-files-found: warn
