name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Complete stable qualification
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/stable-qualification.yml
    with:
      candidate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate-version: "0.1.1"
