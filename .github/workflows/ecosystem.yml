name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@5116071d19a5054bbb85e7f4ffdadc579a049ae7 # v2026.10.26 commit-bound evidence history
    with:
      import-package: ml4t.live
      fetch-depth: 0
      prerelease-exception: python-315-live-calendar-020
      candidate-version: "0.2.0"
