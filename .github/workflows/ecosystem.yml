name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@56d42098ff91c80c3318d4677c6dc2f178706cf7 # v2026.10.26 candidate identity and Live 0.2 wait
    with:
      import-package: ml4t.live
      prerelease-exception: python-315-live-calendar-020
      candidate-version: "0.2.0"
