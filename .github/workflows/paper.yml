name: Paper qualification

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact candidate commit to qualify
        required: true
        type: string
      qualification-run-id:
        description: Successful qualification run that retained dist-CANDIDATE_SHA
        required: true
        type: string
      extended-provider:
        description: Provider needing fresh evidence, or all for initial qualification
        required: true
        default: all
        type: choice
        options: [alpaca, ib, okx, all]
      publish-evidence:
        description: Publish a durable evidence prerelease (requires separate maintainer authorization)
        required: false
        default: false
        type: boolean
      run-soak:
        description: Six-hour duration stage; requires separate explicit authorization
        required: false
        default: false
        type: boolean

permissions: {}

env:
  UV_NO_SOURCES: "1"
  UV_VERSION: "0.10.9"

jobs:
  paper:
    name: Supported provider paper evidence
    runs-on: [self-hosted, linux, x64, ib-paper]
    timeout-minutes: 390
    environment: paper
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate-sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.candidate-sha }}
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
      - name: Create a clean paper qualification environment
        id: qualification-runtime
        run: |
          uv venv --clear --python 3.12 "${{ runner.temp }}/paper-venv"
          uv pip install \
            --python "${{ runner.temp }}/paper-venv/bin/python" \
            "psutil==7.2.2"
      - name: Bind the downloaded artifact to its successful qualification run
        id: candidate-binding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ runner.temp }}/paper-venv/bin/python"
          scripts/qualification/qualify_paper.py candidate
          --artifacts-dir dist
          --candidate-sha "${{ inputs.candidate-sha }}"
          --qualification-run-id "${{ inputs.qualification-run-id }}"
          --repository "${{ github.repository }}"
          --checkout-root "${{ github.workspace }}"
          --output paper-evidence/candidate.json
      - name: Install only the candidate ML4T wheel outside the checkout
        id: candidate-install
        run: |
          uv export --locked --no-default-groups --no-emit-project --no-hashes \
            --output-file "${{ runner.temp }}/paper-runtime-constraints.txt"
          uv pip install --python "${{ runner.temp }}/paper-venv/bin/python" \
            --constraints "${{ runner.temp }}/paper-runtime-constraints.txt" dist/*.whl
          mkdir -p "${{ runner.temp }}/paper-run" "${{ runner.temp }}/paper-state"
      - name: Exercise Alpaca paper order lifecycle
        id: alpaca-exercise
        if: ${{ inputs.extended-provider == 'alpaca' || inputs.extended-provider == 'all' }}
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_paper.py" provider
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --provider alpaca
          --phase exercise
          --checkout-root "${{ github.workspace }}"
          --state-directory "${{ runner.temp }}/paper-state"
          --tag-seed "${{ github.run_id }}"
          --output "${{ github.workspace }}/paper-evidence/alpaca-exercise.json"
      - name: Reconcile Alpaca in a fresh process
        id: alpaca-restart
        if: >-
          ${{
            always() &&
            (inputs.extended-provider == 'alpaca' || inputs.extended-provider == 'all')
          }}
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_paper.py" provider
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --provider alpaca
          --phase restart
          --checkout-root "${{ github.workspace }}"
          --state-directory "${{ runner.temp }}/paper-state"
          --tag-seed "${{ github.run_id }}"
          --output "${{ github.workspace }}/paper-evidence/alpaca-restart.json"
      - name: Exercise IB paper order lifecycle
        id: ib-exercise
        if: >-
          ${{
            always() &&
            (inputs.extended-provider == 'ib' || inputs.extended-provider == 'all')
          }}
        continue-on-error: true
        env:
          IB_ACCOUNT: ${{ secrets.IB_ACCOUNT }}
          IB_CLIENT_ID: ${{ secrets.IB_CLIENT_ID }}
          IB_HOST: ${{ secrets.IB_HOST }}
          IB_PORT: ${{ secrets.IB_PORT }}
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_paper.py" provider
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --provider ib
          --phase exercise
          --checkout-root "${{ github.workspace }}"
          --state-directory "${{ runner.temp }}/paper-state"
          --tag-seed "${{ github.run_id }}"
          --output "${{ github.workspace }}/paper-evidence/ib-exercise.json"
      - name: Reconcile IB in a fresh process
        id: ib-restart
        if: >-
          ${{
            always() &&
            (inputs.extended-provider == 'ib' || inputs.extended-provider == 'all')
          }}
        continue-on-error: true
        env:
          IB_ACCOUNT: ${{ secrets.IB_ACCOUNT }}
          IB_CLIENT_ID: ${{ secrets.IB_CLIENT_ID }}
          IB_HOST: ${{ secrets.IB_HOST }}
          IB_PORT: ${{ secrets.IB_PORT }}
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_paper.py" provider
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --provider ib
          --phase restart
          --checkout-root "${{ github.workspace }}"
          --state-directory "${{ runner.temp }}/paper-state"
          --tag-seed "${{ github.run_id }}"
          --output "${{ github.workspace }}/paper-evidence/ib-restart.json"
      - name: Qualify the supported OKX feed against the public service
        id: okx-external
        if: ${{ inputs.extended-provider == 'okx' || inputs.extended-provider == 'all' }}
        continue-on-error: true
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_feeds.py" okx
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --checkout-root "${{ github.workspace }}"
          --output "${{ github.workspace }}/feed-evidence/okx.json"
      - name: Run the selected six-hour provider soak
        id: provider-soaks
        if: >-
          ${{
            always() && inputs.run-soak &&
            (
              (
                inputs.extended-provider == 'alpaca' &&
                steps.alpaca-exercise.outcome == 'success' &&
                steps.alpaca-restart.outcome == 'success'
              ) ||
              (
                inputs.extended-provider == 'ib' &&
                steps.ib-exercise.outcome == 'success' &&
                steps.ib-restart.outcome == 'success'
              ) ||
              (
                inputs.extended-provider == 'okx' &&
                steps.okx-external.outcome == 'success'
              ) ||
              (
                inputs.extended-provider == 'all' &&
                steps.alpaca-exercise.outcome == 'success' &&
                steps.alpaca-restart.outcome == 'success' &&
                steps.ib-exercise.outcome == 'success' &&
                steps.ib-restart.outcome == 'success' &&
                steps.okx-external.outcome == 'success'
              )
            )
          }}
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          IB_ACCOUNT: ${{ secrets.IB_ACCOUNT }}
          IB_CLIENT_ID: ${{ secrets.IB_CLIENT_ID }}
          IB_HOST: ${{ secrets.IB_HOST }}
          IB_PORT: ${{ secrets.IB_PORT }}
        run: >-
          cd "${{ github.workspace }}" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          -m scripts.qualification.qualify_provider_soaks
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --checkout-root "${{ github.workspace }}"
          --provider "${{ inputs.extended-provider }}"
          --alpaca-output "${{ github.workspace }}/paper-evidence/alpaca-soak.json"
          --ib-output "${{ github.workspace }}/paper-evidence/ib-soak.json"
          --okx-output "${{ github.workspace }}/feed-evidence/okx-soak.json"
      - name: Require complete redacted evidence for both paper providers
        id: evidence
        if: ${{ always() && inputs.run-soak && inputs.extended-provider == 'all' }}
        continue-on-error: true
        run: >-
          "${{ runner.temp }}/paper-venv/bin/python"
          scripts/qualification/qualify_paper.py assemble
          --candidate paper-evidence/candidate.json
          --report paper-evidence/alpaca-exercise.json
          --report paper-evidence/alpaca-restart.json
          --report paper-evidence/ib-exercise.json
          --report paper-evidence/ib-restart.json
          --soak-report paper-evidence/alpaca-soak.json
          --soak-report paper-evidence/ib-soak.json
          --output paper-evidence/paper-qualification.json
      - name: Require the installed feed support contract and external evidence
        id: feed-evidence
        if: >-
          ${{ always() && inputs.run-soak && (inputs.extended-provider == 'okx' || inputs.extended-provider == 'all') }}
        continue-on-error: true
        run: >-
          cd "${{ runner.temp }}/paper-run" &&
          "${{ runner.temp }}/paper-venv/bin/python"
          "${{ github.workspace }}/scripts/qualification/qualify_feeds.py" assemble
          --candidate "${{ github.workspace }}/paper-evidence/candidate.json"
          --report "${{ github.workspace }}/feed-evidence/okx.json"
          --soak-report "${{ github.workspace }}/feed-evidence/okx-soak.json"
          --output "${{ github.workspace }}/feed-evidence/feed-qualification.json"
      - name: Scan retained paper evidence for identifiers and credentials
        id: evidence-scan
        if: ${{ always() }}
        run: >-
          "${{ runner.temp }}/paper-venv/bin/python"
          scripts/qualification/scan_release_secrets.py
          --evidence-root paper-evidence
          --output paper-evidence/secret-scan.json
      - name: Scan retained feed evidence for identifiers and credentials
        id: feed-evidence-scan
        if: ${{ always() }}
        run: >-
          "${{ runner.temp }}/paper-venv/bin/python"
          scripts/qualification/scan_release_secrets.py
          --evidence-root feed-evidence
          --output feed-evidence/secret-scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.evidence-scan.outcome == 'success' && steps.feed-evidence-scan.outcome == 'success' }}
        with:
          name: paper-${{ inputs.candidate-sha }}-${{ github.run_id }}
          path: |
            paper-evidence/
            feed-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Require every provider qualification stage to pass
        if: ${{ always() }}
        env:
          ALPACA_EXERCISE: ${{ steps.alpaca-exercise.outcome }}
          ALPACA_RESTART: ${{ steps.alpaca-restart.outcome }}
          EXTENDED_PROVIDER: ${{ inputs.extended-provider }}
          FEED_EVIDENCE: ${{ steps.feed-evidence.outcome }}
          FEED_EVIDENCE_SCAN: ${{ steps.feed-evidence-scan.outcome }}
          IB_EXERCISE: ${{ steps.ib-exercise.outcome }}
          IB_RESTART: ${{ steps.ib-restart.outcome }}
          OKX_EXTERNAL: ${{ steps.okx-external.outcome }}
          PAPER_EVIDENCE: ${{ steps.evidence.outcome }}
          PAPER_EVIDENCE_SCAN: ${{ steps.evidence-scan.outcome }}
          PROVIDER_SOAKS: ${{ steps.provider-soaks.outcome }}
        run: >-
          "${{ runner.temp }}/paper-venv/bin/python"
          scripts/qualification/check_paper_outcomes.py
          --stage "${{ inputs.run-soak && 'complete' || 'compatibility' }}"
          --extended-provider "$EXTENDED_PROVIDER"
          --alpaca-exercise "$ALPACA_EXERCISE"
          --alpaca-restart "$ALPACA_RESTART"
          --ib-exercise "$IB_EXERCISE"
          --ib-restart "$IB_RESTART"
          --okx-external "$OKX_EXTERNAL"
          --paper-evidence-scan "$PAPER_EVIDENCE_SCAN"
          --feed-evidence-scan "$FEED_EVIDENCE_SCAN"
          --provider-soaks "$PROVIDER_SOAKS"
          --paper-evidence "$PAPER_EVIDENCE"
          --feed-evidence "$FEED_EVIDENCE"

  archive:
    name: Retain provider evidence
    needs: paper
    if: ${{ inputs.publish-evidence && inputs.run-soak }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paper-${{ inputs.candidate-sha }}-${{ github.run_id }}
          path: provider-evidence/
      - name: Package the validated redacted evidence
        run: zip -q -r provider-evidence.zip provider-evidence
      - name: Publish durable provider evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "provider-evidence-${{ github.run_id }}"
          provider-evidence.zip
          --repo "${{ github.repository }}"
          --target "${{ inputs.candidate-sha }}"
          --title "Provider qualification evidence ${{ github.run_id }}"
          --notes "Redacted provider qualification evidence retained for contract-based reuse."
          --prerelease
