name: Paper qualification

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact candidate commit to qualify
        required: true
        type: string
      qualification-run-id:
        description: Successful qualification run that retained dist-CANDIDATE_SHA
        required: true
        type: string
      extended-provider:
        description: Provider needing fresh evidence, or all for initial qualification
        required: true
        default: all
        type: choice
        options: [alpaca, ib, okx, all]
      publish-evidence:
        description: Publish a durable evidence prerelease (requires separate maintainer authorization)
        required: false
        default: false
        type: boolean
      run-soak:
        description: Six-hour duration stage; requires separate explicit authorization
        required: false
        default: false
        type: boolean

permissions: {}

env:
  UV_NO_SOURCES: "1"
  UV_VERSION: "0.10.9"

jobs:
  alpaca-account:
    name: Read Alpaca paper account
    if: ${{ inputs.extended-provider == 'alpaca' && !inputs.run-soak && !inputs.publish-evidence }}
    runs-on: [self-hosted, linux, x64, ib-paper]
    timeout-minutes: 5
    environment: paper
    permissions: {}
    steps:
      - name: Read account without submitting orders and encrypt the result
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import http.client
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          key = os.environ["ALPACA_API_KEY"]
          secret = os.environ["ALPACA_SECRET_KEY"]
          if not key or not secret:
              raise SystemExit("Alpaca paper credentials are missing")
          connection = http.client.HTTPSConnection("paper-api.alpaca.markets", timeout=15)
          try:
              connection.request(
                  "GET", "/v2/account",
                  headers={"APCA-API-KEY-ID": key, "APCA-API-SECRET-KEY": secret},
              )
              response = connection.getresponse()
              if response.status != 200:
                  raise SystemExit(f"Alpaca paper account lookup returned HTTP {response.status}")
              account = json.loads(response.read(65536))
          finally:
              connection.close()
          summary = [
              account["account_number"][-4:], key[-3:], account["buying_power"],
              account["regt_buying_power"], account["cash"], account["trading_blocked"],
              account["account_blocked"], account["status"],
          ]
          with tempfile.TemporaryDirectory() as directory:
              public_key = Path(directory) / "public.pem"
              public_key.write_bytes(base64.b64decode(""))
              encrypted = subprocess.run(
                  ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", str(public_key),
                   "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256"],
                  input=json.dumps(summary, separators=(",", ":")).encode(),
                  capture_output=True,
                  check=True,
              )
          print("ALPACA_ACCOUNT_ENCRYPTED=" + base64.b64encode(encrypted.stdout).decode())
          PY
