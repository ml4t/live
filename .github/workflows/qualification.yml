name: Reusable beta qualification

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  UV_NO_SOURCES: "1"
  UV_VERSION: "0.10.9"

jobs:
  source-quality:
    name: Source quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --all-extras --dev --locked
      - run: uv run python scripts/qualification/run_beta_gate.py --group source

  deterministic:
    name: Deterministic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --all-extras --dev --locked
      - run: uv run python scripts/qualification/run_beta_gate.py --group deterministic

  dependency:
    name: Dependency audit and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev --locked
      - run: uv run python scripts/qualification/run_beta_gate.py --group dependency

  stress:
    name: Stress and controlled faults
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev --locked
      - run: uv run python scripts/qualification/run_beta_gate.py --group stress

  documentation:
    name: Strict documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev --locked
      - run: uv run python scripts/qualification/run_beta_gate.py --group documentation

  build:
    name: Build fixed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs:
      - source-quality
      - deterministic
      - dependency
      - stress
      - documentation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev --locked
      - name: Build from the fixed commit timestamp
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv build --build-constraints build-constraints.txt
      - run: uv run twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  artifact-qualification:
    name: Exact installed artifact qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12 3.13 3.14 3.15
      - run: uv sync --python 3.12 --all-extras --dev --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Qualify the uploaded artifact without rebuilding for promotion
        run: >-
          uv run python scripts/qualification/qualify_artifacts.py
          --artifacts-dir dist
          --output artifact-qualification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ github.sha }}
          path: artifact-qualification.json
          if-no-files-found: error
          retention-days: 30
