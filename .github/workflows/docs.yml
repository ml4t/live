name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_VERSION: "0.1.1"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --dev --extra docs --locked
      - name: Build strict commit-bound documentation
        env:
          ML4T_DOCS_VERSION: ${{ env.CANDIDATE_VERSION }}
          ML4T_DOCS_COMMIT: ${{ env.CANDIDATE_SHA }}
        run: uv run mkdocs build --strict
      - name: Verify rendered documentation identity
        run: >-
          uv run python scripts/qualification/verify_documentation_identity.py
          --site-dir site
          --version "${{ env.CANDIDATE_VERSION }}"
          --commit "${{ env.CANDIDATE_SHA }}"
