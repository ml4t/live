name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_VERSION: "0.1.1"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Check out pinned public book tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stefan-jansen/machine-learning-for-trading
          ref: d2edec54b1c7a6a9d7a97d8129eb05db4491e1eb
          path: companion
          filter: blob:none
          sparse-checkout: README.md
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --dev --extra docs --locked
      - name: Build strict commit-bound documentation
        env:
          ML4T_DOCS_VERSION: ${{ env.CANDIDATE_VERSION }}
          ML4T_DOCS_COMMIT: ${{ env.CANDIDATE_SHA }}
        run: uv run mkdocs build --strict
      - name: Check pinned book files
        run: uv run python scripts/qualification/check_book_links.py --companion-repo companion
      - name: Check documentation links
        run: uv run python scripts/qualification/check_documentation_links.py
      - name: Verify rendered documentation identity
        run: >-
          uv run python scripts/qualification/verify_documentation_identity.py
          --site-dir site
          --version "${{ env.CANDIDATE_VERSION }}"
          --commit "${{ env.CANDIDATE_SHA }}"
