name: Release recovery verification

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact qualified commit
        required: true
        type: string
      qualification-run-id:
        description: Release run containing the retained evidence
        required: true
        type: string
      tag:
        description: Existing version tag to diagnose
        required: true
        type: string

permissions: {}

jobs:
  paper-evidence:
    name: Require matching provider evidence
    runs-on: ubuntu-latest
    outputs:
      wheel_sha256: ${{ steps.paper.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.paper.outputs.sdist_sha256 }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate-sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - name: Create a clean evidence runtime
        id: paper-runtime
        run: |
          uv venv --clear --python 3.12 "${RUNNER_TEMP}/paper-evidence-venv"
          uv pip install             --python "${RUNNER_TEMP}/paper-evidence-venv/bin/python"             "psutil==7.2.2"
      - name: Match provider evidence to the recovery candidate
        id: paper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${RUNNER_TEMP}/paper-evidence-venv/bin/python"
          scripts/qualification/check_paper_evidence.py
          --repository "${{ github.repository }}"
          --commit "${{ inputs.candidate-sha }}"
          --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify retained immutable evidence
    runs-on: ubuntu-latest
    needs: paper-evidence
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate-sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: dist-${{ inputs.candidate-sha }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: qualification-${{ inputs.candidate-sha }}
          path: qualification-evidence/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification-run-id }}
          name: security-${{ inputs.candidate-sha }}
          path: security-evidence/
      - name: Verify the immutable artifact and evidence identity
        env:
          PAPER_WHEEL_SHA256: ${{ needs.paper-evidence.outputs.wheel_sha256 }}
          PAPER_SDIST_SHA256: ${{ needs.paper-evidence.outputs.sdist_sha256 }}
        run: >-
          uv run --no-project --with packaging
          python scripts/qualification/verify_release_identity.py
          --artifacts-dir dist
          --artifact-report qualification-evidence/artifact-qualification.json
          --security-report security-evidence/security-report.json
          --sbom security-evidence/sbom.cdx.json
          --dependency-snapshot security-evidence/dependency-snapshot.json
          --commit "${{ inputs.candidate-sha }}"
          --tag "${{ inputs.tag }}"
          --paper-wheel-sha256 "$PAPER_WHEEL_SHA256"
          --paper-sdist-sha256 "$PAPER_SDIST_SHA256"
      - name: Verify the recovery policy
        run: >-
          uv run --no-project
          python scripts/qualification/check_release_recovery.py
