name: Bug report
description: Report reproducible incorrect behavior in ml4t-live
title: "[Bug]: "
labels:
  - "type: bug"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: affected"
body:
  - type: markdown
    attributes:
      value: |
        Follow the [contribution guide](https://github.com/ml4t/live/blob/main/CONTRIBUTING.md).
        Search existing issues and describe one problem or coherent change per issue.
        Report suspected vulnerabilities privately, not in this form.
  - type: input
    id: version
    attributes:
      label: Affected package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, installation method, and relevant extras.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete example and error output.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Public behavior or results
        - Python or operating-system support
        - Cross-library contract
        - Installation or dependency resolution
        - No known compatibility impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable conditions that demonstrate the issue is resolved.
    validations:
      required: true
  - type: textarea
    id: ai-assistance
    attributes:
      label: AI assistance and accountability
      description: State whether AI helped with this report and how. Confirm you checked the facts and can explain the reproduction or requested outcome.
      placeholder: "None, or describe the assistance and your verification."
    validations:
      required: true
