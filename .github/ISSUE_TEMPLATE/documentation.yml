name: Documentation problem
description: Report missing, incorrect, or difficult ml4t-live documentation
title: "[Docs]: "
labels:
  - "type: documentation"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: none"
body:
  - type: markdown
    attributes:
      value: |
        Follow the [contribution guide](https://github.com/ml4t/live/blob/main/CONTRIBUTING.md).
        Search existing issues and describe one problem or coherent change per issue.
        Report suspected vulnerabilities privately, not in this form.
  - type: input
    id: version
    attributes:
      label: Package or documentation version
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or API location
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State what is missing, incorrect, or difficult to follow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Required documentation outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: ai-assistance
    attributes:
      label: AI assistance and accountability
      description: State whether AI helped with this report and how. Confirm you checked the facts and can explain the reproduction or requested outcome.
      placeholder: "None, or describe the assistance and your verification."
    validations:
      required: true
