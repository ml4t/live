[project]
name = "ml4t-live"
dynamic = ["version"]
description = "Live trading runtime for ML4T strategies with broker integrations, risk checks, and shadow mode."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stefan Jansen", email = "stefan@applied-ai.com" },
]
maintainers = [
    { name = "Stefan Jansen", email = "pm@ml4trading.io" },
]
keywords = [
    "finance",
    "quantitative-finance",
    "algorithmic-trading",
    "live-trading",
    "broker-api",
    "risk-management",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "ml4t-backtest>=0.1.5,<0.2",
    "ml4t-specs>=0.1.4,<0.2",
    "ib-async==2.1.0",
    "alpaca-py==0.44.0",
    "httpx==0.28.1",
    "ccxt<=4.5.78,>=4.5.78",
]

[project.scripts]
ml4t-live = "ml4t.live.cli.main:app"

[project.urls]
Homepage = "https://www.ml4trading.io/docs/live/"
Documentation = "https://www.ml4trading.io/docs/live/"
Repository = "https://github.com/ml4t/live"
Issues = "https://github.com/ml4t/live/issues"
Changelog = "https://github.com/ml4t/live/releases"

[project.optional-dependencies]
dev = [
    "packaging==26.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty",
    "pre-commit>=4.6.2",
    "pyyaml==6.0.3",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
experimental = [
    "databento==0.86.0",
]

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.hooks.vcs]
version-file = "src/ml4t/live/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t"]
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ml4t/live",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = ["**/AGENTS.md"]

[dependency-groups]
build = [
    "hatchling==1.32.0",
    "hatch-vcs==0.5.0",
]
test = [
    "packaging==26.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "psutil>=7.2.2",
    "pyyaml==6.0.3",
]
dev = [
    { include-group = "test" },
    "databento>=0.38.0; python_version < '3.15'",
    "ruff>=0.8.0",
    "ty",
    "pre-commit>=4.6.2",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning",
]
markers = [
    "deterministic: requires no network, credentials, or external process",
    "integration: exercises multiple package components",
    "external: requires a network service or external process and explicit --run-external",
    "paper: requires an authenticated paper-trading account and explicit --run-external",
    "stress: sustained resource test requiring explicit --run-stress",
    "benchmark: performance measurement requiring explicit --run-benchmarks",
]

[tool.ruff]
line-length = 100
exclude = ["_version.py"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B007", "B011", "F841"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
unresolved-attribute = "ignore"  # Polars type stubs
unused-type-ignore-comment = "ignore"
