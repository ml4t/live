[project]
name = "ml4t-live"
dynamic = ["version"]
description = "Live trading platform for ML4T strategies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "ml4t-backtest @ git+https://github.com/ml4t/backtest.git@12bcbc5684112a6137b0778350d7f44588544164",
    "ml4t-specs @ git+https://github.com/ml4t/specs.git@85d3476683a70b4f17e5e8cb82dd23d05b373dc8",
    "ib-async==2.1.0",
    "alpaca-py==0.43.5",
    "httpx==0.28.1",
    "ccxt>=4.5.31,<=4.5.71",
]

[project.scripts]
ml4t-live = "ml4t.live.cli.main:app"

[project.urls]
Homepage = "https://www.ml4trading.io/docs/live/"
Documentation = "https://www.ml4trading.io/docs/live/"
Repository = "https://github.com/ml4t/live"
Issues = "https://github.com/ml4t/live/issues"
Changelog = "https://github.com/ml4t/live/releases"

[project.optional-dependencies]
dev = [
    "packaging==26.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "ty",
    "pre-commit>=3.0",
    "pyyaml==6.0.3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
experimental = [
    "databento==0.83.0",
]

[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ml4t/live/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t"]
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ml4t/live",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = ["**/AGENTS.md"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
build = [
    "hatchling==1.31.0",
    "hatch-vcs==0.5.0",
]
dev = [
    "packaging==26.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1.0",
    "psutil>=7.1.3",
    "ruff>=0.8.0",
    "ty",
    "pre-commit>=3.0",
    "pyyaml==6.0.3",
    "twine>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning",
]
markers = [
    "deterministic: requires no network, credentials, or external process",
    "integration: exercises multiple package components",
    "external: requires a network service or external process and explicit --run-external",
    "paper: requires an authenticated paper-trading account and explicit --run-external",
    "stress: sustained resource test requiring explicit --run-stress",
    "benchmark: performance measurement requiring explicit --run-benchmarks",
]

[tool.ruff]
line-length = 100
exclude = ["_version.py"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B007", "B011", "F841"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
unresolved-attribute = "ignore"  # Polars type stubs
unused-type-ignore-comment = "ignore"
