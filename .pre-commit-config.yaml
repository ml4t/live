repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: local
    hooks:
      - id: text-hygiene
        name: non-mutating text hygiene
        entry: uv run python scripts/qualification/check_text_hygiene.py
        language: system
        types: [text]
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        files: ^src/
        types: [python]
        pass_filenames: false
