schema_version = 1
evidence_max_age_days = 7
vulnerability_policy = "block every known advisory in the locked runtime closure"
abandonment_threshold_days = 1095
allowed_license_identifiers = [
    "Apache-2.0",
    "0BSD",
    "APSL-2.0",
    "BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PSF-2.0",
    "CC0-1.0",
    "Zlib",
]

[dependencies.ml4t-backtest]
requirement = "ml4t-backtest>=0.2.0,<0.3"
minimum = "ml4t-backtest==0.2.0"
locked = "ml4t-backtest==0.2.0"
maximum = "ml4t-backtest>=0.2.0,<0.3"
license = "MIT"
support = "shared lifecycle version 1 and temporal version 2 contracts"

[dependencies.ml4t-specs]
requirement = "ml4t-specs>=0.2.0,<0.3"
minimum = "ml4t-specs==0.2.0"
locked = "ml4t-specs==0.2.0"
maximum = "ml4t-specs>=0.2.0,<0.3"
license = "MIT"
support = "versioned calendar declarations and shared lifecycle contracts"

[dependencies.numpy]
requirement = "numpy>=2.3.2,<2.5"
minimum = "numpy==2.3.2"
locked = "numpy==2.4.6"
maximum = "numpy>=2.3.2,<2.5"
license = "BSD-3-Clause"
support = "calendar provider datetime arithmetic requires the qualified pre-2.5 API"

[dependencies.pandas]
requirement = "pandas>=2.3.3,<3.1"
minimum = "pandas==2.3.3"
locked = "pandas==3.0.5"
maximum = "pandas>=2.3.3,<3.1"
license = "BSD-3-Clause"
support = "calendar provider holiday construction requires the qualified pre-3.1 API"

[dependencies.ib-async]
requirement = "ib-async==2.1.0"
minimum = "ib-async==2.1.0"
locked = "ib-async==2.1.0"
maximum = "ib-async==2.1.0"
license = "BSD"
support = "active upstream; exact SDK version because broker behavior is release-sensitive"

[dependencies.alpaca-py]
requirement = "alpaca-py==0.44.0"
minimum = "alpaca-py==0.44.0"
locked = "alpaca-py==0.44.0"
maximum = "alpaca-py==0.44.0"
license = "Apache-2.0"
support = "active upstream; exact version because 0.43.2 omits a required runtime dependency"

[dependencies.httpx]
requirement = "httpx==0.28.1"
minimum = "httpx==0.28.1"
locked = "httpx==0.28.1"
maximum = "httpx==0.28.1"
license = "BSD-3-Clause"
support = "active upstream; exact pre-1.0 transport API"

[dependencies.ccxt]
requirement = "ccxt==4.5.88"
minimum = "ccxt==4.5.88"
locked = "ccxt==4.5.88"
maximum = "ccxt==4.5.88"
license = "MIT"
support = "exact patched SDK; upgrades must replace vulnerable HTTP dependency pins"

[dependencies.databento]
requirement = "databento==0.87.0"
minimum = "databento==0.87.0"
locked = "databento==0.87.0"
maximum = "databento==0.87.0"
license = "Apache-2.0"
support = "experimental optional adapter; exact SDK version"
matrix = false

[dependencies.certifi]
requirement = "certifi==2026.10.19"
minimum = "certifi==2026.10.19"
locked = "certifi==2026.10.19"
maximum = "certifi==2026.10.19"
license = "MPL-2.0"
support = "patched trust bundle; upgrades must replace roots affected by GHSA-6q48-6c7w-9gw2"

[dependencies.aiohttp]
requirement = "aiohttp==3.14.4"
minimum = "aiohttp==3.14.4"
locked = "aiohttp==3.14.4"
maximum = "aiohttp==3.14.4"
license = "Apache-2.0"
support = "patched SDK transport; existing environments must replace vulnerable 3.14.3"

[imports]
alpaca = "alpaca-py"
ccxt = "ccxt"
databento = "databento"
httpx = "httpx"
ib_async = "ib-async"
"ml4t.backtest" = "ml4t-backtest"
"ml4t.specs" = "ml4t-specs"

[build-dependencies.hatchling]
requirement = "hatchling==1.32.4"
license = "MIT"
support = "active upstream; exact isolated-build backend"

[build-dependencies.hatch-vcs]
requirement = "hatch-vcs==0.5.0"
license = "MIT"
support = "active upstream; exact VCS version plugin"
