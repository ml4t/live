name: ml4t-live
version: dynamic from the installed distribution
description: Live trading runtime for causal ML4T strategies

portability_contract:
  lifecycle: lifecycle version 1
  scope: callback order and canonical strategy intents
  exclusions:
    - venue fills
    - latency
    - market-data subscriptions
    - risk decisions
    - account state

engine:
  class: LiveEngine
  import: ml4t.live
  constructor: LiveEngine(strategy, broker, feed, **runtime_options)
  methods:
    - await connect()
    - await run()
    - await stop()
  purpose: Async orchestration with transactional startup, cleanup, and bounded recovery

brokers:
  support: stable-supported within documented paper workflows and capabilities
  adapters:
    - name: IBBroker
      import: ml4t.live
      constructor: IBBroker(host="127.0.0.1", port=7497, client_id=1, account=None, market_data_type=None)
      requires: ib-async plus TWS or IB Gateway
    - name: AlpacaBroker
      import: ml4t.live
      constructor: AlpacaBroker(api_key, secret_key, paper=True)
      requires: alpaca-py and Alpaca credentials
  common_async_methods:
    - await connect()
    - await disconnect()
    - await submit_order_async(asset, quantity, side=None, order_type=MARKET, limit_price=None, stop_price=None)
    - await cancel_order_async(order_id)
    - await close_position_async(asset)
    - await get_positions_async()
    - await get_pending_orders_async(asset=None)
    - await get_account_value_async()
    - await get_cash_async()

feeds:
  stable_supported:
    - OKXFundingFeed
    - BarAggregator
    - BarBuffer
  experimental_opt_in:
    - AlpacaDataFeed
    - IBDataFeed
    - DataBentoFeed
    - CryptoFeed
  experimental_requirement: Pass experimental=true; these adapters are outside stable support.

safety:
  class: SafeBroker
  import: ml4t.live
  wraps: AsyncBrokerProtocol with risk controls, reconciliation, persistence, and journaling
  config:
    class: LiveRiskConfig
    preferred_mode_parameter:
      execution_mode:
        type: shadow | paper | live
        default: null
        description: Must be explicit before external execution
    compatibility_parameter:
      shadow_mode:
        type: bool
        default: false
        description: Deprecated-style compatibility alias; prefer execution_mode
    defaults:
      max_position_value: 50000.0
      max_position_shares: 1000.0
      max_total_exposure: 200000.0
      max_positions: 20
      max_order_value: 10000.0
      max_order_shares: 500.0
      max_orders_per_minute: 10
      max_daily_loss: 5000.0
      max_drawdown_pct: 0.05
      max_price_deviation_pct: 0.05
      max_data_staleness_seconds: 60.0
      dedup_window_seconds: 1.0
      kill_switch_enabled: false
      allow_reducing_risk_when_killed: true
      halt_on_reducing_risk_failure: true
      fail_on_reconciliation_mismatch: false
      state_file: .ml4t_risk_state.json
      journal_file: null
      fail_on_journal_error: true

sync_async_bridge:
  class: ThreadSafeBrokerWrapper
  import: ml4t.live
  behavior: Strategy callbacks run on one dedicated worker thread while broker I/O runs on the async event loop.
  constraint: Synchronous wrapper methods cannot be called from the event-loop thread.

protocols:
  - BrokerProtocol
  - AsyncBrokerProtocol
  - DataFeedProtocol

minimal_shadow_example: |
  config = LiveRiskConfig(
      execution_mode="shadow",
      max_position_value=50_000,
      max_order_value=10_000,
  )
  safe_broker = SafeBroker(broker, config)
  engine = LiveEngine(strategy, safe_broker, feed)
  await engine.connect()
  try:
      await engine.run()
  finally:
      await engine.stop()

qualification:
  platform: Linux
  python: ["3.12", "3.13", "3.14"]
  command: uv run python scripts/qualification/run_stable_gate.py
  release_effects: The command does not tag, publish, or place live-money orders.
